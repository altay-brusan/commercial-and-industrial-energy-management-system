syntax = "proto3";

option csharp_namespace = "GrpcServer";

service Customer{
	rpc GetCustomerInfo(CustomerLookUpModel) returns(CustomerModel);
	rpc GetNewCustomersInfo(NewCustomerRequest) returns(stream CustomerModel);
	rpc GetListCustomers(NewCustomerRequest) returns( CustomerListModel);
}
message NewCustomerRequest{

}
message CustomerLookUpModel{
	int32 userId=1;
}
message CustomerModel{
	string firstname=1;
	string lastName=2;
	string emailAddress=3;
	bool isAlive=4;
	int32 age=5;
}
message CustomerListModel{
    repeated CustomerModel customers = 1;
}
