syntax = "proto3";

package ems.solar.stream;

import "types_generic.proto";

// Service definition for PPC interactions
service PPCService {
  // RPC for streaming solar data with a specified period
  rpc StreamSolarData (SolarDataRequest) returns (stream SolarData);
}

// Request message with a period parameter
message SolarDataRequest {
  uint32 id = 1; // ID of the component in the system
  uint32 period_s = 2; // Period in seconds between data updates
}

// Comprehensive Solar data structure
message SolarData {
  uint32 id = 1;                // ID of the component in the system
  ems.types.generic.DC_Power panel_power = 2; // Power output of the solar panels [Kilowatts (kW)]
  ems.types.generic.DC_Power charger_power = 3; // Power output of the solar charger [Kilowatts (kW)]
  ems.types.generic.DC_Power DC_output = 4; // DC output from the mppt [Kilowatts (kW)]
  ems.types.generic.AC_Power AC_output = 5; // AC output from the mppt charger [Kilowatts (kW)]
  double performance_ratio = 6; // Performance ratio of the solar system [%]
  double pv_panel_temperature = 7; // Temperature of the solar panels [Degrees Celsius]
  double solar_energy_produced = 8;    // Total energy generated by the solar panels [Kilowatt-hours (kWh)]
  ems.types.generic.Status status = 9; // Status of the solar system
  }