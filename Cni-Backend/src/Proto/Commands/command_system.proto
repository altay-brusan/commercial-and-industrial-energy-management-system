syntax = "proto3";

package ems.system.command;

// The BESS mode enum definition
enum BESSMode {
    CHARGE = 0; // Grid charges the BESS
    DISCHARGE = 1; // BESS supports the grid
    STANDBY = 2; // Off grid mode
}

service SystemModeService {
    rpc SetSystemMode (SystemModeData) returns (CommandResponse);
    rpc GetSystemMode (Empty) returns (SystemModeData);
    rpc SetChargePower (ChargePowerData) returns (CommandResponse);
    rpc SetDischargePower (DischargePowerData) returns (CommandResponse);
    rpc EmergencyShutDown (Empty) returns (CommandResponse);
}

message SystemModeData {
    string id = 1;
    int64 timestamp = 2;
    BESSMode mode = 3;
}

message ChargePowerData {
    float ChargePower = 1;
}

message DischargePowerData {
    float TotalPower = 1;
    float PowerFactor = 2;
}

message CommandResponse {
    string id = 1;
    bool success = 2;
    string message = 3;
}

message Empty {}